<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitlane Supply</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Pitlane Supply</h1>
    <p>Premium F1-style gear • Malaysia</p>
  </header>

  <section class="hero">
    <h2>Race-Ready Caps & Apparel</h2>
    <p>High-quality team merchandise, ready to ship.</p>
    <a href="#products" class="btn">Shop Now</a>
  </section>

  <section id="products">
    <h2>Featured Items</h2>
    <div class="grid">
      <div class="card">
        <div class="placeholder">Red Bull Cap</div>
        <h3>Max Verstappen Cap</h3>
        <p class="price">RM 199</p>
        <button class="btn">Buy Now</button>
      </div>
      <div class="card">
        <div class="placeholder">Ferrari Cap</div>
        <h3>Ferrari Team Cap</h3>
        <p class="price">RM 189</p>
        <button class="btn">Buy Now</button>
      </div>
      <div class="card">
        <div class="placeholder">Mercedes Tee</div>
        <h3>Mercedes Driver Tee</h3>
        <p class="price">RM 259</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
